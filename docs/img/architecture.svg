<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 460" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="p" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#5A6661"/>
    </marker>
    <style>
      .kotak { fill:#FFFFFF; stroke:#C9D2CD; rx:10; }
      .judul { font-size:15px; font-weight:700; fill:#1C2321; }
      .alat  { font-size:13px; font-weight:600; fill:#1E6E5E; }
      .ket   { font-size:11px; fill:#5A6661; }
      .tahap { font-size:11px; font-weight:700; letter-spacing:.08em; fill:#8A6A1F; }
      .alur  { stroke:#5A6661; stroke-width:1.6; fill:none; marker-end:url(#p); }
    </style>
  </defs>

  <rect x="0" y="0" width="1260" height="460" fill="#F4F6F4"/>
  <text x="24" y="34" font-size="19" font-weight="700" fill="#1C2321">Angkasa Biru Data Harmonization — Tech Stack</text>
  <text x="24" y="54" class="ket">Lima instance API mock sintetis → arsip objek → data warehouse per perusahaan → star schema grup → dashboard</text>

  <!-- SUMBER -->
  <text x="24" y="92" class="tahap">SUMBER (MOCK)</text>
  <rect x="24"  y="100" width="190" height="52" class="kotak" rx="10"/>
  <text x="38" y="121" class="judul">Angkasa Biru</text><text x="38" y="138" class="ket">HRIS AB · 29 endpoint</text>
  <rect x="24"  y="160" width="190" height="52" class="kotak" rx="10"/>
  <text x="38" y="181" class="judul">AB Retail</text><text x="38" y="198" class="ket">HRIS ABR · 39 endpoint</text>
  <rect x="24"  y="220" width="190" height="52" class="kotak" rx="10"/>
  <text x="38" y="241" class="judul">AB Destination</text><text x="38" y="258" class="ket">HRIS ABD · 29 endpoint</text>
  <rect x="24"  y="280" width="190" height="52" class="kotak" rx="10"/>
  <text x="38" y="301" class="judul">AB LMS</text><text x="38" y="318" class="ket">Learning agility · 1 endpoint</text>
  <rect x="24"  y="340" width="190" height="52" class="kotak" rx="10"/>
  <text x="38" y="361" class="judul">AB TMS</text><text x="38" y="378" class="ket">Nilai aspirasi · 1 endpoint</text>
  <text x="38" y="416" class="alat">FastAPI + Uvicorn</text>
  <text x="38" y="432" class="ket">data sintetis deterministik</text>

  <!-- INGESTION -->
  <text x="262" y="92" class="tahap">INGESTION</text>
  <rect x="262" y="190" width="172" height="112" class="kotak" rx="10"/>
  <text x="278" y="216" class="judul">Konektor REST</text>
  <text x="278" y="236" class="alat">Python · requests</text>
  <text x="278" y="254" class="ket">auth, paginasi, retry,</text>
  <text x="278" y="269" class="ket">fan-out per NIK;</text>
  <text x="278" y="284" class="ket">dua fase: extract → load</text>

  <!-- MINIO -->
  <text x="482" y="92" class="tahap">ARSIP</text>
  <rect x="482" y="190" width="150" height="112" class="kotak" rx="10"/>
  <text x="498" y="216" class="judul">MinIO</text>
  <text x="498" y="236" class="alat">Object storage</text>
  <text x="498" y="254" class="ket">JSON per endpoint</text>
  <text x="498" y="269" class="ket">per batch — sumber</text>
  <text x="498" y="284" class="ket">muat ke Postgres</text>

  <!-- DWH -->
  <text x="680" y="92" class="tahap">DATA WAREHOUSE</text>
  <rect x="680" y="160" width="200" height="172" class="kotak" rx="10"/>
  <text x="696" y="186" class="judul">PostgreSQL 16 · DWH</text>
  <text x="696" y="206" class="ket">raw (JSONB) → raw_table →</text>
  <text x="696" y="221" class="ket">reference · seed · registry →</text>
  <text x="696" y="236" class="ket">staging → silver ×3 perusahaan</text>
  <text x="696" y="262" class="alat">dbt</text>
  <text x="696" y="280" class="ket">pemetaan + uji kunci,</text>
  <text x="696" y="295" class="ket">relasi, nilai baku</text>
  <text x="696" y="317" class="ket">25 entitas / perusahaan</text>

  <!-- DATA HUB -->
  <text x="928" y="92" class="tahap">PENYAJIAN</text>
  <rect x="928" y="160" width="170" height="172" class="kotak" rx="10"/>
  <text x="944" y="186" class="judul">PostgreSQL 16</text>
  <text x="944" y="204" class="judul">Data Hub</text>
  <text x="944" y="226" class="alat">gold · star schema</text>
  <text x="944" y="246" class="ket">3 fact + 10 dimensi</text>
  <text x="944" y="261" class="ket">EQS &amp; 9-Box</text>
  <text x="944" y="283" class="ket">membaca silver via</text>
  <text x="944" y="298" class="ket">postgres_fdw</text>

  <!-- METABASE -->
  <text x="1146" y="92" class="tahap">VISUALISASI</text>
  <rect x="1146" y="190" width="104" height="112" class="kotak" rx="10"/>
  <text x="1160" y="216" class="judul">Metabase</text>
  <text x="1160" y="236" class="ket">3 dashboard</text>
  <text x="1160" y="251" class="ket">42 kartu</text>
  <text x="1160" y="266" class="ket">role read-only</text>

  <!-- alur -->
  <path class="alur" d="M214,126 C238,126 238,214 262,214"/>
  <path class="alur" d="M214,186 C238,186 238,230 262,230"/>
  <path class="alur" d="M214,246 L262,246"/>
  <path class="alur" d="M214,306 C238,306 238,262 262,262"/>
  <path class="alur" d="M214,366 C238,366 238,278 262,278"/>
  <path class="alur" d="M434,246 L482,246"/>
  <path class="alur" d="M632,246 L680,246"/>
  <path class="alur" d="M880,246 L928,246"/>
  <path class="alur" d="M1098,246 L1146,246"/>

  <!-- fondasi -->
  <rect x="262" y="360" width="974" height="62" class="kotak" rx="10"/>
  <text x="280" y="386" class="judul">Orkestrasi &amp; runtime</text>
  <text x="280" y="406" class="ket">5 DAG harian, enam task per sumber</text>
  <text x="560" y="386" class="alat">Apache Airflow</text>
  <text x="560" y="406" class="ket">check → extract → load → flatten → silver → gold</text>
  <text x="900" y="386" class="alat">Docker Compose</text>
  <text x="900" y="406" class="ket">13 layanan satu perintah</text>
  <text x="1105" y="386" class="alat">pytest + dbt test</text>
  <text x="1105" y="406" class="ket">±840 pemeriksaan</text>
</svg>
